<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Тренировки">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Личный дневник тренировок. Записывайте подходы, отслеживайте рабочие веса и прогресс. Все данные хранятся только на устройстве.">
  <meta property="og:title" content="Тренировки — личный дневник">
  <meta property="og:description" content="Офлайн-дневник тренировок с историей, замерами и аналитикой.">
  <meta property="og:type" content="website">
  <title>Тренировки — личный дневник</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <canvas id="halo-fx" aria-hidden="true"></canvas>

  <!-- Боковая панель (компьютер): сворачивается в узкую колонку иконок -->
  <aside class="sidebar" id="sidebar" aria-label="Навигация">
    <div class="sb-head">
      <div class="logo-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="6.6" fill="none" stroke-width="2.2"/><circle class="dot" cx="12" cy="12" r="1.9"/></svg></div>
      <span class="sb-brand">Дневник</span>
      <button class="sb-toggle" type="button" data-shell="toggle-sidebar" aria-label="Свернуть панель" title="Свернуть панель ( [ )"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="M9.5 4.5v15"/></svg></button>
    </div>
    <div class="sb-scroll">
      <button class="sb-search" type="button" data-shell="palette" data-tip="Поиск · Ctrl K"><span data-icon="search"></span><span>Поиск и команды</span><kbd>Ctrl K</kbd></button>
      <div class="sb-label">Меню</div>
      <button class="sb-item is-active" type="button" data-tab="home" data-tip="Главная · 1"><span data-icon="house"></span><span class="sb-text">Главная</span></button>
      <button class="sb-item" type="button" data-tab="workout" data-tip="Тренировка · 2" id="sb-workout"><span data-icon="dumbbell"></span><span class="sb-text">Тренировка</span><span class="sb-badge" id="sb-live">идёт</span></button>
      <button class="sb-item" type="button" data-tab="history" data-tip="История · 3"><span data-icon="calendar"></span><span class="sb-text">История</span></button>
      <button class="sb-item" type="button" data-tab="progress" data-tip="Прогресс · 4"><span data-icon="chart"></span><span class="sb-text">Прогресс</span></button>
      <div class="sb-label">Разделы</div>
      <button class="sb-item" type="button" data-tab="exercises" data-tip="Упражнения · 5"><span data-icon="list"></span><span class="sb-text">Упражнения</span></button>
      <button class="sb-item" type="button" data-tab="body" data-tip="Параметры тела · 6"><span data-icon="body"></span><span class="sb-text">Параметры тела</span></button>
      <button class="sb-item" type="button" data-tab="profile" data-tip="Профиль и настройки · 7"><span data-icon="settings"></span><span class="sb-text">Профиль и настройки</span></button>
      <div class="sb-label">Быстро</div>
      <button class="sb-item" type="button" data-action="quick-add" data-tip="Быстрое действие · N"><span data-icon="plus"></span><span class="sb-text">Быстрое действие</span></button>
    </div>
    <div class="sb-foot">
      <div class="sb-meter" title="Тренировок на этой неделе">
        <div class="sb-meter-head"><span>Неделя</span><b id="sb-week">0 / 3</b></div>
        <div class="seg-bar" id="sb-seg"></div>
      </div>
      <div class="sb-user"><div class="sb-avatar">ДТ</div><div class="sb-user-copy"><b>Мой дневник</b><small>Данные только на устройстве</small></div></div>
    </div>
  </aside>

  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="logo-tile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="6.6" fill="none" stroke-width="2.2"/><circle class="dot" cx="12" cy="12" r="1.9"/></svg></div>
      <div class="topbar-copy"><span class="eyebrow">Личный дневник</span><span class="topbar-title">Тренировки</span></div>
      <div class="topbar-actions">
        <button class="icon-button" type="button" data-shell="palette" aria-label="Поиск" title="Поиск"><span data-icon="search"></span></button>
        <button class="icon-button topbar-action" data-action="quick-add" aria-label="Быстрое действие" title="Быстрое действие"><span data-icon="plus"></span></button>
      </div>
    </header>
    <main id="screen" class="screen" tabindex="-1" aria-live="polite"></main>
    <div id="live-workout-indicator" class="live-workout-indicator" hidden aria-live="off"></div>
    <nav class="tabbar" aria-label="Основная навигация">
      <button class="tab-item is-active" data-tab="home"><span data-icon="house"></span><small>Главная</small></button>
      <button class="tab-item" data-tab="workout"><span data-icon="dumbbell"></span><small>Тренировка</small></button>
      <button class="tab-item" data-tab="history"><span data-icon="calendar"></span><small>История</small></button>
      <button class="tab-item" data-tab="progress"><span data-icon="chart"></span><small>Прогресс</small></button>
      <button class="tab-item" data-tab="more"><span data-icon="more"></span><small>Ещё</small></button>
    </nav>
  </div>

  <div class="palette-backdrop" id="palette" role="dialog" aria-modal="true" aria-label="Поиск и команды">
    <div class="palette">
      <div class="palette-input"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="palette-input" type="text" placeholder="Раздел или упражнение…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="./js/db.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/xlsx.js"></script>
  <script src="./js/backup.js"></script>
  <script src="./js/shell.js?v=2.0.0"></script>
  <script src="./js/app.js?v=2.0.1"></script>
</body>
</html>
